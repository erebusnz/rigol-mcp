name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Installs the project (src/ layout) plus the test extra from the locked versions.
      # Tests are fully offline — no instrument, NI-VISA, or system libusb required.
      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Check installed wheel catalog
        run: |
          uv build
          uv run --isolated --no-project --with dist/rigol_mcp-*.whl python -I -c "from rigol_mcp.models import capabilities_for; from rigol_mcp.drivers import driver_for; assert capabilities_for('RIGOL,DHO802,SERIAL,1').analog_channel_count == 2; assert capabilities_for('RIGOL,DS1104Z-PLUS,SERIAL,1').analog_channel_count == 4; assert driver_for('RIGOL,MHO98,SERIAL,1').name == 'MHO900'"
