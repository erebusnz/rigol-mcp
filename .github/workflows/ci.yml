name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Installs the project (src/ layout) plus the test extra from the locked versions.
      # Tests are fully offline — no instrument, NI-VISA, or system libusb required.
      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run --no-sync pytest

  smoke-unlocked:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # Resolve runtime dependencies from package metadata, independently of uv.lock.
      - name: Install without the lockfile
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --refresh .
          uv pip check --python .venv/bin/python

      - name: Import the installed server
        run: |
          .venv/bin/python -c "import rigol_mcp.server; from importlib.metadata import version; print('MCP', version('mcp'))"
